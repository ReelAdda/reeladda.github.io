name: Daily FilmyChill Update
on:
  schedule:
    # Two runs daily. Odd off-peak minutes on purpose: GitHub delays scheduled
    # workflows at popular slots (:00/:30) by 3-5 hours; off-peak minutes run near on-time.
    # Morning: ~7:22 AM IST (1:52 UTC) - fresh picks ready before the morning traffic.
    # Evening: ~7:22 PM IST (13:52 UTC) - catches same-day OTT drops whose TMDB
    # metadata (providers/ratings) filled in during the day after the midnight release.
    - cron: "52 1 * * *"
    - cron: "52 13 * * *"
  workflow_dispatch: {}   # also lets you run it manually anytime with one click
permissions:
  contents: write
# Same group as probe.yml: a build and a probe never push to main at the same moment.
# (A probe that pushed mid-build used to make this run's final push fail, losing the update.)
concurrency:
  group: filmychill-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a moving tag: a retagged release can't change what
      # runs with write access to this repo. Same pins in probe.yml; bump both together.
      - name: Checkout site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      # OPTIONAL dependency: @resvg/resvg-js rasterises the branded share cards. It is in
      # optionalDependencies and every call site is guarded, so if this step fails the build
      # still completes — pages simply fall back to TMDB backdrops for og:image.
      - name: Install optional deps (share-card renderer)
        # npm ci installs exactly what package-lock.json pins (review, Oct 2026): this code later
        # runs with the TMDB key, the Firebase service account and a write token, so it must never
        # pick up a new release of some package mid-tree. Update the lock deliberately.
        run: npm ci --no-audit --no-fund
        continue-on-error: true

      # Unit tests run FIRST (no API calls) so a code regression fails fast,
      # before we spend time/quota on the build. Covers pure functions + the
      # SSR-injection guard (incl. the comment-in-script regression test).
      # TEST_TIERS=1: only a SAFETY test failure stops the build here. A content (wording)
      # failure is written to test-results.json and health.js turns the run red at the end,
      # once the site has updated. On 8 Oct 2026 one wording test cost a whole day's update.
      # The built pages live on the `site` branch, not main (scripts/site.js). The build reads and
      # patches the frozen ones, so they come back first. The run stops here if far fewer film
      # pages arrive than the manifest expects, so a bad restore can never publish a site
      # missing its archive.
      - name: Restore the built site
        run: node scripts/site.js restore

      - name: Run unit tests
        run: node scripts/test.js
        env:
          TEST_TIERS: "1"

      - name: Fetch latest releases
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Visitors' votes (scripts/lib/votes.js). Optional: without it, votes aren't read.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional: enables "trailer views" social proof on cards. Create a free key in
          # Google Cloud Console (YouTube Data API v3) and add it as a repo secret named
          # YT_API_KEY. If absent, the build simply skips trailer stats — nothing breaks.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # Pages moved to "facts rendered by the live template" per edition per build
          # (scripts/lib/migrate.js). Always on: unset means the default (500). Set the
          # repository variable only to override it; 0 stops the migration.
          MIGRATE_BATCH: ${{ vars.MIGRATE_BATCH }}
          # Back-catalogue backfill (see backfillCatalog in scripts/update.js). Builds a batch
          # of already-streaming catalogue titles per country per run — the long tail that
          # answers "where can I watch X" years after any release week. Each built page costs
          # one enrich call, so CATALOG_BATCH is the cost dial: start small, read one run's
          # log, then raise it. Set CATALOG to "0" to pause the backfill without losing the
          # queue cursor in catalog-manifest.json.
          CATALOG: "1"
          # 5 per country per run (Sept 2026): ~140 new pages a day across 14 markets, down
          # from ~700. Google had indexed only ~1 in 8 pages, so adding more mostly grew the
          # unindexed backlog — and at 700/day the site would reach GitHub Pages' 1 GB cap in
          # ~2 months (~9 months at this rate). Raise again once Search Console's Sitemaps
          # screen shows the film sitemaps' indexed share climbing, or after moving to R2.
          # Oct 2026: 18 markets make it ~180 a day; the site was 247 MB when they launched.
          CATALOG_BATCH: "5"
        run: node scripts/update.js

      # Smoke test validates the SHAPE + freshness of EVERY country's data file.
      # Fails the build (before commit) if any file is missing, empty, stale, or malformed —
      # so a bad/partial build never ships.
      - name: Smoke-test generated data
        # Every market, not just the first four: a market added later is exactly the one
        # nobody is watching.
        run: node scripts/smoke.js in us uk au de ae ca sg my ph nz kr jp id br mx es fr

      - name: Verify film pages exist
        run: |
          node -e "
            const fs = require('fs');
            const pages = fs.readdirSync('movie').filter(f => f.endsWith('.html'));
            if (pages.length < 5) { console.error('VALIDATION FAILED: film pages missing'); process.exit(1); }
            console.log('film pages OK:', pages.length);
          "

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "filmychill-bot"
          git config user.email "actions@github.com"
          # main holds code, data files and the homepage template. Built pages go to the `site`
          # branch in the next step and are ignored here (.gitignore), so main's history grows
          # only with real data. -A stages deletions too.
          git add -A -- data.json 'data-*.json' ott-seen.json takes.json pages-manifest.json catalog-manifest.json index.html about/ ott-history.jsonl ott-watch.json
          # zz/ is the test suite's sandbox country; never committed.
          git rm -r --cached --quiet --ignore-unmatch zz
          # Optional state files: absent until their feature is set up (git add exits 128 on a
          # pathspec that matches nothing, which would fail the step).
          git add -A -- votes-agg.json votes-state.json 2>/dev/null || true
          # Honest sitemap dates for every non-film URL (lib/sitemap.js).
          git add -A -- page-lastmods.json 2>/dev/null || true
          # Facts of every page rendered from facts (scripts/lib/facts.js, lib/migrate.js).
          git add -A -- facts/ 2>/dev/null || true
          # Data accuracy results (scripts/accuracy.js): this run's findings and the per-run trend.
          git add -A -- accuracy-latest.json accuracy-history.jsonl 2>/dev/null || true
          # India streaming data (scripts/lib/indiadata.js): the cinema census and digital release dates.
          git add -A -- ott-census.json ott-digital.json 2>/dev/null || true
          # Facts-only rendering: each edition's mode and comparison record (scripts/lib/factsq.js).
          git add -A -- facts-mode.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Daily release scan: $(date -u +%Y-%m-%d)"
            # Code pushed to main while the build ran (14 Oct 2026) made a plain push a
            # non-fast-forward and failed the run. Rebase this data commit onto the new main
            # and push again. Never force: a rebase that can't apply cleanly fails the run
            # rather than overwrite someone's commit; the next run rebuilds the data anyway.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt): rebasing onto the latest main"
              git fetch --quiet origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::main changed the same files during this build; this run's data was not saved. The next run will rebuild it."
                exit 1
              fi
            done
            if [ "$pushed" != true ]; then echo "::error::push still rejected after 3 attempts"; exit 1; fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The published site on its own branch, `site`, which GitHub Pages serves: main's tree plus
      # the built pages, as one commit with no parent, replaced on every build. Serving the site
      # never adds history (Oct 2026: main grew ~16 MB a day, nearly all of it pages). Skips the
      # push when nothing changed.
      - name: Publish site branch
        id: site
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: node scripts/site.js publish

      # Cloudflare Workers Static Assets deploy. Dormant until the CLOUDFLARE_API_TOKEN secret
      # exists, so this file can be committed before the migration without breaking any run.
      # Deploys exactly the published `site` commit (git archive), never the working tree: the
      # build leaves node_modules/, zz/ (test sandbox) and indexnow-payload.json on disk, none
      # of which GitHub Pages serves. Same files, same URLs, so Google sees no change.
      - name: Check Cloudflare credentials
        id: cf
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.enabled == 'true' && (steps.site.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf _site && mkdir _site
          git archive "${{ steps.site.outputs.commit }}" | tar -x -C _site
          echo "files to upload: $(find _site -type f | wc -l)  (free plan cap 20,000 / paid 100,000)"
          npx --yes wrangler@4 deploy

      # IndexNow: tell Bing/DuckDuckGo/Yandex INSTANTLY that today's pages changed, instead
      # of waiting for a crawl — exactly the freshness race a daily site wants to win.
      # (Google doesn't use IndexNow; it relies on the sitemap lastmod + normal crawling.)
      # Free and keyless as a service; the key below just proves domain ownership via the
      # matching KEY.txt file in the repo root, served by GitHub Pages. Only pings when a
      # commit actually happened. Ping failures never fail the build (|| true).
      - name: Ping IndexNow
        if: steps.site.outputs.changed == 'true'
        run: |
          sleep 90  # give GitHub Pages a moment to deploy the new commit first
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @indexnow-payload.json || true

      # After the deploy on purpose: the site has already been committed and deployed. Any
      # stage that failed and was skipped during the build (see RUN HEALTH in update.js) turns
      # this run red, which makes GitHub email you, and the run page's Summary tab says what broke.
      - name: Build health check
        run: node scripts/health.js

      # LAST: what visitors actually get. Waits for the new build to be live, then fetches the
      # homepage, sample film pages, EVERY stylesheet the committed pages link, and the files
      # crawlers read (scripts/livecheck.js). On 4 Oct 2026 every film page linked a stylesheet
      # that was never committed and rendered unstyled for ~5 hours; this turns that into a red
      # run (and an email) within minutes. Runs even when the health check failed.
      - name: Live site check
        if: ${{ !cancelled() && (steps.site.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/livecheck.js
