<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — FilmyChill</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B165F">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="/manifest.json">
<style>
  :root { --bg:#FFF7EC; --card:#fff; --ink:#1A1633; --mute:#6B6890; --line:#E4E1F5; --deep:#1B165F; --marigold:#FFAD1F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F0C24; --card:#1A1538; --ink:#F4F1FF; --mute:#A9A4CC; --line:#2A2454; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--deep); color:#fff; padding:12px 16px; font-weight:700; letter-spacing:1.2px; font-size:20px; }
  main { flex:1; display:grid; place-items:center; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; max-width:420px; width:100%; text-align:center; }
  .dot { width:56px; height:56px; border-radius:50%; margin:0 auto 14px; background:var(--marigold); display:grid; place-items:center; font-size:26px; }
  h1 { font-size:22px; margin:0 0 6px; } p { color:var(--mute); margin:0 0 18px; }
  a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; border-radius:999px; background:var(--deep); color:#fff; font-weight:700; text-decoration:none; }
  button { margin-left:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:700 14px system-ui,sans-serif; cursor:pointer; }
</style>
</head>
<body>
<header>FILMYCHILL</header>
<main>
  <div class="card">
    <div class="dot" aria-hidden="true">📵</div>
    <h1>You're offline</h1>
    <p>Pages you've opened recently are saved on this device. This one isn't yet, so try again when you're back online.</p>
    <a class="btn" href="/">This week's picks</a><button type="button" onclick="location.reload()">Retry</button>
  </div>
</main>
</body>
</html>
